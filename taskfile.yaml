version: '3'

tasks:
  test:
    desc: Run PHPUnit tests
    cmds:
      - vendor/bin/phpunit --configuration phpunit.xml --verbose
    preconditions:
      - test -f vendor/bin/phpunit || { echo "PHPUnit not installed. Run composer install."; exit 1; }

  lint:
    desc: Lint PHP files for syntax errors
    cmds:
      - find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

  build:
    desc: Build plugin zip (runtime allowlist; matches deploy.sh)
    cmds:
      - rm -f ../intersoccer-product-variations.zip
      - >-
        zip -r ../intersoccer-product-variations.zip
        intersoccer-product-variations.php wpml-config.xml README.md
        includes css js lang

  hooks:
    desc: Install Git pre-commit hook to run tests automatically
    cmds:
      - |
        cat <<EOF > .git/hooks/pre-commit
        #!/bin/sh
        echo "Running pre-commit tasks..."
        task test || { echo "Tests failed! Commit aborted."; exit 1; }
        EOF
      - chmod +x .git/hooks/pre-commit

  all:
    desc: Run all checks (lint, test)
    deps: [lint, test]